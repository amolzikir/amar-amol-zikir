name: Create Zikra Android release signing key

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zikra-release-key
  cancel-in-progress: false

jobs:
  create-release-key:
    name: Create protected release keystore and fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZIKRA_KEYSTORE_PASSWORD: ${{ secrets.ZIKRA_KEYSTORE_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify signing secret is configured
        shell: bash
        run: |
          if [ -z "$ZIKRA_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the repository Actions secret ZIKRA_KEYSTORE_PASSWORD before running this workflow."
            exit 1
          fi
          if [ "${#ZIKRA_KEYSTORE_PASSWORD}" -lt 20 ]; then
            echo "::error::Use a unique password of at least 20 characters."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate the long-lived PKCS12 signing key
        shell: bash
        run: |
          set +x
          test ! -e android/android.keystore
          keytool -genkeypair -v \
            -keystore android/android.keystore \
            -storetype PKCS12 \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Zikra Android App, OU=Mobile, O=Zikra, C=BD" \
            -storepass "$ZIKRA_KEYSTORE_PASSWORD" \
            -keypass "$ZIKRA_KEYSTORE_PASSWORD"
          echo "## Zikra signing certificate fingerprint" >> "$GITHUB_STEP_SUMMARY"
          keytool -list -v -keystore android/android.keystore -storetype PKCS12 -alias android -storepass "$ZIKRA_KEYSTORE_PASSWORD" | grep -E 'SHA256:|SHA-256:' >> "$GITHUB_STEP_SUMMARY"
          echo "The private keystore is password-protected. Keep a private offline backup."

      - name: Upload encrypted release keystore backup
        uses: actions/upload-artifact@v4
        with:
          name: zikra-release-keystore
          path: android/android.keystore
          if-no-files-found: error
          retention-days: 90
