name: Convert Zikra icon to PNG
on:
  push:
    paths:
      - ".github/workflows/convert-zikra-icon.yml"
permissions:
  contents: read
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Convert selected artwork to 512px PNG
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          im = Image.open("assets/app-icon.jpg").convert("RGBA")
          im = im.resize((512, 512), Image.Resampling.LANCZOS)
          im.save("app-icon-512.png", format="PNG", optimize=True)
          check = Image.open("app-icon-512.png")
          assert check.size == (512, 512) and check.format == "PNG"
          print("Verified PNG:", check.size, check.format)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zikra-png-icon
          path: app-icon-512.png
          retention-days: 2
