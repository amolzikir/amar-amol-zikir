name: Firestore security rules

on:
  push:
    paths:
      - "firestore.rules"
      - "index.html"
      - "manifest.webmanifest"
      - "assets/app-icon.svg"
      - "assets/app-icon-maskable.svg"
      - "tests/pwa-installability.test.js"
      - "tests/pwa-update-notice.test.js"
      - "tests/dua-source-links.test.js"
      - "tests/daily-hadith.test.js"
      - "tests/indexeddb-transaction.test.js"
      - "sw.js"
      - "tests/service-worker-offline.test.js"
      - "firebase.json"
      - "package.json"
      - "tests/indexeddb-transaction.test.js"
      - "tests/cloud-sync-retry.test.js"
      - "tests/system-tracker-load-safety.test.js"
      - "tests/keyboard-focus-accessibility.test.js"
      - "tests/mobile-touch-targets.test.js"
      - "tests/mobile-safe-area.test.js"
      - "tests/system-tracker-load-safety.test.js"
      - "tests/firestore.rules.test.js"
      - "tests/local-account-partition.test.js"
      - "tests/dom-security.test.js"
      - "tests/daily-amal-recovery.test.js"
      - "tests/daily-amal-save-safety.test.js"
      - "tests/tasbih-save-safety.test.js"
      - "tests/quran-tracker-safety.test.js"
      - "quran-reader.js"
      - "tests/quran-reader.test.js"
      - "tests/backup-restore.test.js"
      - "tests/note-reminder-safety.test.js"
      - "tests/folder-operations.test.js"
      - "tests/directions-navigation.test.js"
      - "tests/note-save-safety.test.js"
      - "tests/note-copy-safety.test.js"
      - "tests/note-action-safety.test.js"
      - "tests/note-reminder-safety.test.js"
      - "tests/hijri-calendar-sunset.test.js"
      - "tests/directions-navigation.test.js"
      - ".github/workflows/firestore-rules.yml"
  pull_request:
    paths:
      - "firestore.rules"
      - "quran-reader.js"
      - "tests/quran-reader.test.js"
      - "sw.js"
      - "manifest.webmanifest"
      - "assets/app-icon.svg"
      - "assets/app-icon-maskable.svg"
      - "tests/pwa-installability.test.js"
      - "tests/dua-source-links.test.js"
      - "tests/daily-hadith.test.js"
      - "firebase.json"
      - "package.json"
      - "tests/service-worker-offline.test.js"
      - "tests/indexeddb-transaction.test.js"
      - "tests/cloud-sync-retry.test.js"
      - "tests/system-tracker-load-safety.test.js"
      - "tests/firestore.rules.test.js"
      - "tests/local-account-partition.test.js"
      - "tests/dom-security.test.js"
      - "tests/backup-restore.test.js"
      - "tests/folder-operations.test.js"
      - "tests/hijri-calendar-sunset.test.js"
      - ".github/workflows/firestore-rules.yml"

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies
        run: npm install
      - name: Run PWA installability tests
        run: npm run test:pwa-installability
      - name: Run PWA update notice tests
        run: npm run test:pwa-updates
      - name: Run dua source link tests
        run: npm run test:dua-sources
      - name: Run daily hadith source and rotation tests
        run: npm run test:daily-hadith
      - name: Run offline service worker fallback tests
        run: npm run test:offline-shell
      - name: Run IndexedDB transaction commit tests
        run: npm run test:indexeddb-commit
      - name: Run Cloud sync retry tests
        run: npm run test:cloud-retry
      - name: Run system tracker load safety tests
        run: npm run test:tracker-load
      - name: Run keyboard focus accessibility tests
        run: npm run test:keyboard-focus
      - name: Run mobile touch target tests
        run: npm run test:touch-targets
      - name: Run local account partition tests
        run: npm run test:local
      - name: Run DOM security tests
        run: npm run test:security
      - name: Run Daily Amal recovery tests
        run: npm run test:daily-recovery
      - name: Run Daily Amal save safety tests
        run: npm run test:daily-amal-save
      - name: Run Daily Amal history preservation tests
        run: npm run test:daily-amal-history
      - name: Run Tasbih save safety tests
        run: npm run test:tasbih
      - name: Run Quran tracker safety tests
        run: npm run test:quran-tracker
      - name: Run Quran reader validation and safety tests
        run: npm run test:quran-reader
      - name: Run backup and restore tests
        run: npm run test:backup
      - name: Run folder operation safety tests
        run: npm run test:folders
      - name: Run note save safety tests
        run: npm run test:notes
      - name: Run note copy safety tests
        run: npm run test:note-copy
      - name: Run note action safety tests
        run: npm run test:note-actions
      - name: Run note reminder safety tests
        run: npm run test:note-reminders
      - name: Run Hijri sunset rollover tests
        run: npm run test:hijri-calendar
      - name: Run route planner navigation tests
        run: npm run test:directions
      - name: Run Firestore emulator security tests
        run: npm run test:rules
